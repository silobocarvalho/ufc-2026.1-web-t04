<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo Prático de Margin CSS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&family=Stick+No+Bills:wght@200..800&display=swap" rel="stylesheet">

    <style>
        body {
             font-family: "Stick No Bills", sans-serif;
            background-color: #f4f4f4;
        }

        /* -------------------------------------- */
        /* 1. EXEMPLO DE CENTRALIZAÇÃO HORIZONTAL */
        /* -------------------------------------- */
        .caixa-centralizada {
            /* 1. Define uma largura para a caixa */
            width: 70%;
            background-color: #3498db;
            color: white;
            padding: 15px;
            border: 3px solid #2980b9;
            text-align: center;
            min-width: 500px;
           
            /* 2. O segredo: 'auto' nas margens laterais centraliza o bloco */
            margin: 50px auto;
            /* 50px para Topo e Inferior, e 'auto' para Esquerda e Direita */

            
        }

        /* -------------------------------------- */
        /* 2. EXEMPLO DE MARGEM SHORTHAND */
        /* -------------------------------------- */
        .caixa-margens {
            width: 400px;
            background-color: #2ecc71;
            color: black;
            padding: 10px;
            border: 2px solid #27ae60;
           
            /* Quatro valores: Topo(10px) Direita(50px) Inferior(30px) Esquerda(5px) */
            margin: 10px 50px 30px 5px;

             font-family: "Stick No Bills", sans-serif;
        }

        

    </style>
</head>
<body>

    <div class="caixa-centralizada">
        Este elemento está centralizado horizontalmente.
        (Usa: margin: 50px auto;)
    </div>

    <div class="caixa-margens">
        Este elemento demonstra o "shorthand" de margens, criando um deslocamento irregular:
        <br>
        Topo: 10px, Direita: 50px, Inferior: 30px, Esquerda: 5px
    </div>

</body>
</html>
