<!DOCTYPE html>
<html>
<head>
    <style>
        .mesa {
            position: relative;
            height: 300px;
            background: #e0e0e0;
            padding: 50px;
        }

        .carta {
            width: 150px;
            height: 200px;
            position: absolute; /* Obrigatório para o z-index funcionar */
            border: 2px solid white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
        }

        /* CARTA 1 - Vermelha (A primeira no HTML) */
        .vermelha {
            background-color: #ff4757;
            top: 20px;
            left: 20px;
            z-index: 3; /* VALOR MAIOR: Ela pula para a frente! */
        }

        /* CARTA 2 - Verde */
        .verde {
            background-color: #2ed573;
            top: 50px;
            left: 80px;
            z-index: 2;
        }

        /* CARTA 3 - Azul (A última no HTML) */
        .azul {
            background-color: #1e90ff;
            top: 80px;
            left: 140px;
            z-index: 1; /* VALOR MENOR: Ela vai para o fundo. */
        }
    </style>
</head>
<body>

    <div class="mesa">
        <div class="carta vermelha">Z-index: 3</div>
        <div class="carta verde">Z-index: 2</div>
        <div class="carta azul">Z-index: 1</div>
    </div>

    <p>Note que, no código, a Azul é a última, mas visualmente ela está atrás de todas porque o Z-index dela é o menor.</p>

</body>
</html>
