<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="testarProt()">Testar Prototype</button>
</body>
<script>

    String.prototype.converteStringNumero = function (valor) {
        valor = this.toString();
        if(valor === "1"){
            return 1;
        }else if(valor === "2"){
            return 2;
        }else if(valor === "3"){
            return 3;
        }else{
            return null;
        }
    }
    
    function testarProt(){
        let numeroString = "255";

        console.log(typeof(numeroString))
        console.log(numeroString);

        let novoNumero = numeroString.converteStringNumero();

        console.log(typeof(novoNumero))
        console.log(novoNumero);
    }
    

</script>
</html>
