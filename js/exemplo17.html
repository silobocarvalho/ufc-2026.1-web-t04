<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .card {
            border: 3px solid blue;
            max-width: max-content;
            padding: 20px;
            margin: 10px;
        }

        img {
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>

</body>

<script>


    async function downloadDados() {
        const URL = "https://hp-api.onrender.com/api/characters";
        const URL_desconhecido = "https://esfarelado.com.br/wp-content/uploads/2015/02/ilustre-desconhecido-1.jpg";
        const promisseDados = await fetch(URL);
        const dadosJson = await promisseDados.json();

        dadosJson.map(personagem => {

            if (personagem.alive) {

                const divCardPersonagem = document.createElement("div");
                const imgPersonagem = document.createElement("img");
                const nomePersonagem = document.createElement("h3");
                const casaPersonagem = document.createElement("h3");

                divCardPersonagem.id = "container";
                divCardPersonagem.classList.add("card");

                personagem.image ? imgPersonagem.src = personagem.image : imgPersonagem.src = URL_desconhecido;

                nomePersonagem.innerHTML = personagem.name;
                casaPersonagem.innerHTML = personagem.house;

                divCardPersonagem.appendChild(imgPersonagem);
                divCardPersonagem.appendChild(nomePersonagem);
                divCardPersonagem.appendChild(casaPersonagem);

                document.body.appendChild(divCardPersonagem);
            }
        })

    }

    downloadDados();
</script>

</html>
