<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="num1">Número 1: </label> <input id="num1" type="text">
    <br>
    <label for="num2">Número 2: </label> <input id="num2" type="text">
    <br>
    <button id="btnSomar" onclick="somarNumeros()">Somar</button>
    <br>
    <p id="resultado"></p>
</body>

<script>
    function somarNumeros(){
        let valorNum1 = parseInt(document.getElementById("num1").value);

        let valorNum2 = parseInt(document.getElementById("num2").value);

        console.log("O valor da soma é: " + (valorNum1 + valorNum2));

        document.getElementById("resultado").innerHTML = valorNum1 + valorNum2;
    }
</script>

</html>
