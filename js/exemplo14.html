<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="numeros" type="text" onchange="calcular()">
    <p id="resultado"></p>
</body>

<script>
    function calcular(){
        let numerosInput = document.getElementById("numeros").value;
        document.getElementById("resultado").innerHTML = eval(numerosInput);
    }
</script>
</html>
