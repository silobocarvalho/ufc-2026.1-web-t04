<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="downloadDados()">Download Dados</button>
</body>

<script>
    

    async function downloadDados(){
        const promisseDownloadDados = await fetch("https://mdn.github.io/learning-area/javascript/apis/fetching-data/can-store/products.json");
        const dadosJson = await promisseDownloadDados.json();
        dadosJson.map( (produto) => {
            console.log(produto.name);
        } )

    }

</script>

</html>
