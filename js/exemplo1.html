<!DOCTYPE html>
<html>
<body>

<h2>O que posso fazer com JavaScript?</h2>

<p id="meup">JavaScript pode alterar o conteúdo de um elemento HTML.</p>

<button type="button" onclick='alterarTexto()'>Click Me!</button>

</body>

<script>
    function alterarTexto(){
        document.getElementById("meup").innerHTML = "Novo texto usando JavaScript!";

    }
</script>

</html>
