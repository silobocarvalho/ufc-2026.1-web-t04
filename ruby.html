<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo de &lt;ruby&gt; e &lt;rt&gt;</title>
  <style>
    ruby {
      font-size: 20px;
      font-family: Arial, sans-serif;
    }
    rt {
      font-size: 14px;
      color: gray;
    }
  </style>
</head>
<body>
  <h1>Exemplo de &lt;ruby&gt; e &lt;rt&gt;</h1>
  <p>Aqui está um exemplo de texto com anotações de pronúncia:</p>
  <p>Este é o kanji para "montanha": <ruby>山<rt>やま</rt></ruby> (yama).</p>
  <p>Este é um exemplo com um termo em chinês: <ruby>中国<rt>Zhōngguó</rt></ruby> (China). </p>
  <p>Você também pode usar para explicar acrônimos: <ruby>HTML<rt>HyperText Markup Language</rt></ruby>. </p>
</body>
</html>
